controller_manager:
  ros__parameters:
    update_rate: 100

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    servo_controller:
      type: zemo_controllers/ServoController



servo_controller:
  ros__parameters:
    update_rate: 25

    position_joints: []
    velocity_joints: []

    min_voltage: 7.0          # ST3215 docs: 6.0 [V]
    max_voltage: 13.0         # ST3215 docs: 12.6 [V]
    max_temperature: 60.0     # ST3215 docs: /
    max_current: 2000.0       # ST3215 docs: 1500 [mA]
  
    default_timeout: 2.0  
    default_tolerance: 0.03   # ST3215 docs: 0.00153589 [rad]（2pi/4096）



diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["wheel_left_joint"]
    right_wheel_names: ["wheel_right_joint"]

    wheel_separation: 0.5
    wheel_radius: 0.05

    wheel_separation_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0

    odom_frame_id: odom
    base_frame_id: base_link
    enable_odom_tf: true

    # Use wheel position state interface
    position_feedback: true
    # Use real hardware feedback from stm
    open_loop: false

    publish_rate: 50.0
    cmd_vel_timeout: 0.5

    linear.x.min_velocity: -1.0
    linear.x.max_velocity: 1.0
    linear.x.max_acceleration: 1.0
    linear.x.max_deceleration: -1.0

    angular.z.min_velocity: -5.0
    angular.z.max_velocity: 5.0
    angular.z.max_acceleration: 5.0
    angular.z.max_deceleration: -5.0

    linear.x.max_acceleration_reverse: -1.0
    linear.x.max_deceleration_reverse: 1.0

    angular.z.max_acceleration_reverse: -5.0
    angular.z.max_deceleration_reverse: 5.0