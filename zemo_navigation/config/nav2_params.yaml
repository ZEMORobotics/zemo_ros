controller_server:
  ros__parameters:
    use_sim_time: false
    enable_stamped_cmd_vel: true
    controller_frequency: 10.0
    costmap_update_timeout: 0.3
    use_realtime_priority: false
    publish_zero_velocity: true
    action_server_result_timeout: 10.0
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.05
    min_theta_velocity_threshold: 0.01
    failure_tolerance: 0.3
    #speed_limit_topic: speed_limit        # published by speed filter
    odom_topic: "odom"
    controller_plugins: ["FollowPath", "CircularArc", "StraightLine", "Rotation"]
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 3.0           # ja menjao
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: True
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      critics:
        - RotateToGoal
        - Oscillation
        - ObstacleFootprint
        - PathAlign
        - GoalAlign
        - PathDist
        - GoalDist
    CircularArc:
      plugin: "zemo_navigation::CircularArcController" # In Iron and older versions, "/" was used instead of "::"
      collison_disatnce_topic: "/stopping_distance"
      min_lin_vel_tolerance: 0.05
      #stopping_distance: 0.2
    StraightLine:
      plugin: "zemo_navigation::StraightLineMove" 
      collison_disatnce_topic: "/stopping_distance"
      min_lin_vel_tolerance: 0.05
      #stopping_distance: 0.2
      yaw_tolerance: 0.001
    Rotation:
      plugin: "zemo_navigation::Rotation" 
      collison_disatnce_topic: "/stopping_distance"
      min_lin_vel_tolerance: 0.05
      #stopping_distance: 0.2
      yaw_tolerance: 0.001
      

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      rolling_window: false
      always_send_full_costmap: true
      update_frequency: 15.0
      publish_frequency: 8.0
      transform_tolerance: 0.1
      global_frame: map
      robot_base_frame: base_link
      width: 3
      height: 2
      resolution: 0.02
      footprint_padding: 0.03
      #footprint: [ [], [], [], [] ]
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: lidar
        lidar: 
          topic: /scan
          data_type: "LaserScan"
          expected_update_rate: 10000000.1        # samo da ne bi izbacivao warn za pravi treba ostaviti
          sensor_frame: base_link
          inf_is_valid: false
          marking: true
          clearing: true
          #obstacle_max_range: 2.5
          #obstacle_min_range: 0.0
          #raytrace_max_range: 3.0
          #raytrace_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.25
        cost_scaling_factor: 5.0

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 10.0
    costmap_update_timeout: 1.0
    planner_plugins: ['GridBased']
    GridBased:
      plugin: 'nav2_navfn_planner::NavfnPlanner'


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      rolling_window: false
      always_send_full_costmap: false
      update_frequency: 15.0
      publish_frequency: 8.0
      transform_tolerance: 0.1
      width: 3
      height: 2
      resolution: 0.02
      global_frame: map
      robot_base_frame: base_link
      footprint_padding: 0.03
      #footprint: [ [], [], [], [] ]
      plugins: [ "static_layer", "obstacle_layer", "additional_obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: lidar
        lidar: 
          topic: /scan
          data_type: "LaserScan"
          expected_update_rate: 10000000.1        # samo da ne bi izbacivao warn za pravi treba ostaviti
          sensor_frame: base_link
          inf_is_valid: true
          marking: true
          clearing: true
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        enabled: false                                    # zameniti
        subscribe_to_updates: true
        footprint_clearing_enabled: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true                                    # zameniti
        inflation_radius: 0.1
        cost_scaling_factor: 150.0
      additional_obstacle_layer:
        plugin: "zemo_navigation::AdditionalObstacleLayer"
        enabled: true
        add_obstacle_topic: /add_obstacles
        #del_obstacle_topic: /del_obstacles
        obstacle_labels: ['yb1', 'yb2', 'yb3', 'yb4', 'yb5', 'yc1', 'yc2', 'yc3', 'yc4']
        yb1: '[[0.05, 0.5], [0.45, 0.5], [0.45, 0.3], [0.05, 0.3]]'
        yb2: '[[0.45, 0.5], [0.6, 0.35], [0.9, 0.65], [0.75, 0.8]]'
        yb3: '[[0.75, 0.8], [0.95, 0.8], [0.95, 1.2], [0.75, 1.2]]'
        yb4: '[[0.75, 1.2], [0.9, 1.35], [0.6, 1.65], [0.45, 1.5]]'
        yb5: '[[0.45, 1.5], [0.45, 1.7], [0.05, 1.7], [0.05, 1.5]]'
        yc1: '[[0.5, 0.5], [0.4, 0.45], [0.4, 0.35], [0.5, 0.3], [0.6, 0.35], [0.6, 0.45]]'
        yc2: '[[0.85, 0.85], [0.75, 0.8], [0.75, 0.7], [0.85, 0.65], [0.95, 0.7], [0.95, 0.8]]'
        yc3: '[[0.85, 1.35], [0.75, 1.3], [0.75, 1.2], [0.85, 1.15], [0.95, 1.2], [0.95, 1.3]]'
        yc4: '[[0.5, 1.7], [0.4, 1.65], [0.4, 1.55], [0.5, 1.5], [0.6, 1.55], [0.6, 1.65]]'
        # FORMAT: '[(x,y) gore levo cosak], [(x,y) gore desno cosak], [(x,y) dole desno cosak], [(x,y) dole levo cosak]'


behavior_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin" 
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2


collision_detector:
  ros__parameters:
    base_frame_id: "base_link"
    odom_frame_id: "odom"

    frequency: 20.0
    transform_tolerance: 0.1
    source_timeout: 0.5

    polygons: ["FrontZone", "BackZone"]

    FrontZone:
      type: "polygon"
      points: "[[0.15, 0.05],
                [0.15, -0.05],
                [0.0, -0.05],
                [0.0, 0.05]]"
      action_type: "none"
      min_points: 1
      visualize: true
      polygon_pub_topic: "/front_zone"
      enabled: false

    BackZone:
      type: "dynamic_polygon"
      action_type: "none"
      wheel_separation: 0.2               # my
      min_points: 1
      visualize: true                    # my
      polygon_pub_topic: "/dynamic_zone"
      polygon_sub_topic: "/stopping_distance"

    observation_sources: ["scan"]

    scan:
      type: "scan"
      topic: "/scan"
      enabled: true